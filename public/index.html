<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Like These</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <header class="mb-4">
        <h1><i class="bi bi-controller"></i> Games Like These</h1>
        <p class="text-muted">Exercício de rede neural (TensorFlow.js) para recomendação de jogos.</p>
    </header>

    <div class="row g-4 mb-4">
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">User Profile</h5>
                    <div class="mb-3">
                        <label for="user-select" class="form-label">User</label>
                        <select id="user-select" class="form-select"></select>
                    </div>
                    <div class="mb-3">
                        <label for="user-age" class="form-label">Age</label>
                        <input id="user-age" type="text" class="form-control" readonly>
                    </div>
                    <label class="form-label">Played Games</label>
                    <ul id="played-games-list" class="list-group"></ul>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Model Training</h5>
                    <p class="text-muted small">
                        Implemente a rede neural em <code>workers/trainModelWorker.js</code>.
                    </p>
                    <div class="d-flex gap-2 mb-3">
                        <button id="train-button" type="button" class="btn btn-primary">Train Model</button>
                        <button id="recommend-button" type="button" class="btn btn-outline-primary" disabled>
                            Run Recommendation
                        </button>
                    </div>
                    <div class="progress mb-2" role="progressbar">
                        <div id="training-progress-bar" class="progress-bar" style="width: 0%">0%</div>
                    </div>
                    <p id="training-status" class="text-muted small mb-0">Idle.</p>
                </div>
            </div>
        </div>
    </div>

    <section class="mb-4">
        <h5>Recommended for you</h5>
        <div id="recommendations-grid" class="row g-3"></div>
    </section>

    <section>
        <h5>All Games</h5>
        <div id="games-grid" class="row g-3"></div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-vis@1.5.1/dist/tfjs-vis.umd.min.js"></script>
<script type="module" src="/src/index.js"></script>
</body>
</html>
