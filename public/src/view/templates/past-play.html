<li class="list-group-item d-flex justify-content-between align-items-center">
    <span>
        <i class="bi {{likedIcon}}"></i>
        {{title}} <small class="text-muted">({{genre}})</small>
    </span>
    <button type="button" class="btn btn-sm btn-outline-danger" data-action="remove-play" data-game-id="{{id}}">
        <i class="bi bi-x-lg"></i>
    </button>
</li>
